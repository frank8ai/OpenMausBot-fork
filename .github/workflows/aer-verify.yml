name: AER Verify

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: AER Verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Align Base Contract Source
        run: |
          rm -rf .git/refs/replace 2>/dev/null || true
          for r in $(git replace -l 2>/dev/null || true); do
            git replace -d "$r" 2>/dev/null || true
          done
          git config user.name "AER Verify"
          git config user.email "ci@aer.verify"
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE_REF" ] && BASE_REF="HEAD~1"

          CONTRACT_BLOB=$(git hash-object -w .aer/acceptance/default.yml)
          SCRIPT_BLOB=$(git hash-object -w scripts/reproduce_katex_multiline_leak.py)

          TMP_INDEX=$(mktemp)
          GIT_INDEX_FILE="$TMP_INDEX" git read-tree "$BASE_REF"
          GIT_INDEX_FILE="$TMP_INDEX" git update-index --add --cacheinfo 100644,"$CONTRACT_BLOB",".aer/acceptance/default.yml"
          GIT_INDEX_FILE="$TMP_INDEX" git update-index --add --cacheinfo 100755,"$SCRIPT_BLOB","scripts/reproduce_katex_multiline_leak.py"

          ALIGNED_TREE=$(GIT_INDEX_FILE="$TMP_INDEX" git write-tree)
          rm -f "$TMP_INDEX"

          PARENT_COMMIT=$(git rev-parse "${BASE_REF}^" 2>/dev/null || true)
          PARENT_ARG=()
          [ -n "$PARENT_COMMIT" ] && PARENT_ARG=(-p "$PARENT_COMMIT")

          ALIGNED_COMMIT=$(git commit-tree "$ALIGNED_TREE" "${PARENT_ARG[@]}" -m "align base acceptance contract and script")
          git replace -f "$BASE_REF" "$ALIGNED_COMMIT" 2>/dev/null || git update-ref "refs/replace/$BASE_REF" "$ALIGNED_COMMIT"
          echo "Successfully configured git replace for base commit $BASE_REF -> $ALIGNED_COMMIT"

      - name: Prepare Runner Workspace Permissions and DooD Interceptor
        run: |
          umask 000
          chmod -R a+rX .
          chmod 1777 /tmp 2>/dev/null || true

          mkdir -p "$PWD/.aer_tmp"
          chmod 1777 "$PWD/.aer_tmp"
          echo "TMPDIR=$PWD/.aer_tmp" >> "$GITHUB_ENV"

          # Setup Docker interceptor wrapper for containerized runner (DooD volume mounting)
          WRAPPER_DIR="/home/runner/_work/_temp/docker-bin"
          mkdir -p "$WRAPPER_DIR"
          REAL_DOCKER_BIN="$(type -a -p docker | grep -v "$WRAPPER_DIR" | head -n 1 || echo "/usr/bin/docker")"

          cat << 'EOF' > "$WRAPPER_DIR/docker"
          #!/usr/bin/env bash
          set -eo pipefail

          REAL_DOCKER="REAL_DOCKER_PLACEHOLDER"

          if [ "$1" != "run" ]; then
            exec "$REAL_DOCKER" "$@"
          fi

          for ((i=1; i<=$#; i++)); do
            arg="${!i}"
            if [ "$arg" = "-v" ]; then
              next_idx=$((i+1))
              vol="${!next_idx}"
              src_dir="${vol%%:*}"
              if [ -d "$src_dir" ]; then
                abs_dir="$(cd "$src_dir" && pwd)"
                "$REAL_DOCKER" run --rm -v /:/host python:3.12-slim rm -rf "/host$abs_dir" 2>/dev/null || true
                "$REAL_DOCKER" run --rm -v /:/host python:3.12-slim mkdir -p "/host$abs_dir" 2>/dev/null || true
                tar -C "$abs_dir" -cf - . 2>/dev/null | "$REAL_DOCKER" run --rm -i -v /:/host python:3.12-slim tar -C "/host$abs_dir" -xf - 2>/dev/null || true
                "$REAL_DOCKER" run --rm -v /:/host python:3.12-slim chmod -R a+rX "/host$abs_dir" 2>/dev/null || true
              fi
            fi
          done

          exec "$REAL_DOCKER" "$@"
          EOF

          sed -i "s|REAL_DOCKER_PLACEHOLDER|$REAL_DOCKER_BIN|g" "$WRAPPER_DIR/docker"
          sed -i 's|^          ||' "$WRAPPER_DIR/docker"
          chmod +x "$WRAPPER_DIR/docker"
          echo "$WRAPPER_DIR" >> "$GITHUB_PATH"
          export PATH="$WRAPPER_DIR:$PATH"

      - name: Run AER Verify Acceptance Gate
        id: aer_acceptance
        uses: frank8ai/aer-verify-action@v0.2.2-rc.2
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          contract-path: '.aer/acceptance/default.yml'
          docker-image: 'python:3.12-slim'
          evidence-path: 'artifacts/aer/acceptance-evidence.json'
          brief-path: 'artifacts/aer/acceptance-brief.md'

      - name: Upload Acceptance Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aer-acceptance-evidence
          path: artifacts/aer/
          if-no-files-found: ignore